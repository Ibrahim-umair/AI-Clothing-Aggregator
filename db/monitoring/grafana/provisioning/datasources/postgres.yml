apiVersion: 1

datasources:
  - name: Libas Postgres
    uid: libas-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: libas
    user: libas
    isDefault: true
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      # $POSTGRES_PASSWORD is expanded by Grafana itself from the grafana
      # container's own environment at provisioning-load time (a Grafana
      # feature, not docker-compose's ${...} substitution) — so this file
      # never needs a real password in it, dev or prod. See db/docker-compose.yml.
      password: $POSTGRES_PASSWORD
